[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-data-platform"
version = "1.0.0"
description = "Production-inspired Retail Data Infrastructure & Analytics Platform using Python, PySpark, Parquet, DuckDB, and AWS-ready architecture."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "duckdb>=1.0.0",
    "openpyxl>=3.1.2",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyspark>=3.5.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
